<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Someone wants to ask you something</title>
<style>
  :root{
    --bg:#050816;
    --accent:#6C63FF;
    --pink:#FF6EC7;
    --cyan:#7DF9FF;
    --white:#FFFFFF;
    --glass:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.14);
    --text-dim:rgba(255,255,255,.55);
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    touch-action:manipulation;
  }

  body{
    height:100dvh;
    position:relative;
  }

  ::selection{ background:var(--accent); color:#fff; }

  /* ---------- background ---------- */
  #sky{
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(108,99,255,.25), transparent 55%),
      radial-gradient(circle at 80% 30%, rgba(255,110,199,.16), transparent 50%),
      radial-gradient(circle at 50% 85%, rgba(125,249,255,.12), transparent 55%),
      var(--bg);
    background-size:200% 200%;
    animation:skyDrift 22s ease-in-out infinite;
    transition:filter 1.8s ease;
  }
  @keyframes skyDrift{
    0%{ background-position:0% 0%; }
    50%{ background-position:100% 60%; }
    100%{ background-position:0% 0%; }
  }
  #sky.finale{ filter:saturate(1.5) brightness(1.25); }

  #particles{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  .particle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    filter:blur(0.5px);
    opacity:.55;
    animation:drift linear infinite;
  }
  .particle.gold{ background:radial-gradient(circle, #FFE9A8, #FFB84D); box-shadow:0 0 8px rgba(255,200,90,.8); }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-40px) translateX(12px); }
    100%{ transform:translateY(0) translateX(0); }
  }

  /* ---------- layout ---------- */
  #stage{
    position:relative; z-index:2;
    height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:28px 20px;
  }

  #card{
    width:100%;
    max-width:440px;
    min-height:min(340px, 60dvh);
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    padding:36px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    position:relative;
    overflow:hidden;
  }
  #card::before{
    content:"";
    position:absolute; top:-40%; left:-20%;
    width:60%; height:200%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.06), transparent);
    transform:rotate(20deg);
    animation:sheen 7s ease-in-out infinite;
  }
  @keyframes sheen{
    0%,100%{ transform:translateX(-40%) rotate(20deg); opacity:0; }
    50%{ transform:translateX(120%) rotate(20deg); opacity:1; }
  }

  #message-zone{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    min-height:40px;
  }

  .line{
    font-size:clamp(1.05rem, 4.4vw, 1.4rem);
    line-height:1.5;
    text-align:center;
    font-weight:500;
    letter-spacing:.2px;
    color:var(--white);
    opacity:0;
    transform:translateY(8px) scale(.98);
    animation:lineIn .6s cubic-bezier(.22,1,.36,1) forwards;
  }
  .line.dim{ color:var(--text-dim); font-size:clamp(.85rem,3.6vw,1rem); font-weight:400; }
  .line.exit{ animation:lineOut .4s ease forwards; }
  @keyframes lineIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes lineOut{ to{ opacity:0; transform:translateY(-6px) scale(.98); } }

  .typing-indicator{
    display:flex; gap:6px; align-items:center; justify-content:center;
    height:20px;
  }
  .typing-indicator span{
    width:7px; height:7px; border-radius:50%;
    background:var(--cyan);
    opacity:.6;
    animation:bounce 1.1s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2){ animation-delay:.15s; }
  .typing-indicator span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-6px); opacity:1; }
  }

  /* ---------- interactive zone ---------- */
  #interact-zone{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    min-height:0;
    opacity:0;
    transform:translateY(10px);
  }
  #interact-zone.show{ animation:lineIn .5s cubic-bezier(.22,1,.36,1) forwards; }
  #interact-zone.hide{ animation:lineOut .35s ease forwards; }

  .btn-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%; }

  button.choice{
    position:relative;
    overflow:hidden;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    font-size:.95rem;
    font-weight:500;
    padding:13px 20px;
    border-radius:16px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:transform .15s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
    -webkit-user-select:none; user-select:none;
    min-width:100px;
  }
  button.choice:hover{ background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.3); }
  button.choice:active{ transform:scale(.96); }
  button.choice:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  button.choice.primary{
    background:linear-gradient(135deg, var(--accent), #8b7dff);
    border-color:transparent;
    box-shadow:0 6px 20px rgba(108,99,255,.35);
  }
  button.choice .ripple{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,.5);
    transform:scale(0);
    animation:rippleAnim .6s ease-out;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(3.2); opacity:0; } }

  input[type="text"]{
    width:100%;
    max-width:280px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
    font-size:1rem;
    padding:14px 18px;
    border-radius:16px;
    text-align:center;
    outline:none;
    transition:border-color .25s ease, background .25s ease;
  }
  input[type="text"]::placeholder{ color:rgba(255,255,255,.35); }
  input[type="text"]:focus{ border-color:var(--cyan); background:rgba(255,255,255,.1); }

  /* slider */
  .slider-wrap{ width:100%; max-width:300px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .slider-value{
    font-size:2.2rem; font-weight:700;
    background:linear-gradient(135deg, var(--cyan), var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(125,249,255,.25);
  }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:6px; border-radius:10px;
    background:linear-gradient(90deg, var(--cyan), var(--accent) var(--fill,50%), rgba(255,255,255,.12) var(--fill,50%));
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:24px; height:24px; border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 4px rgba(125,249,255,.25), 0 4px 12px rgba(0,0,0,.4);
    cursor:pointer;
    transition:box-shadow .2s ease;
  }
  input[type="range"]::-moz-range-thumb{
    width:24px; height:24px; border-radius:50%; border:none;
    background:#fff;
    box-shadow:0 0 0 4px rgba(125,249,255,.25), 0 4px 12px rgba(0,0,0,.4);
    cursor:pointer;
  }
  .slider-labels{ display:flex; justify-content:space-between; width:100%; font-size:.75rem; color:var(--text-dim); }

  /* ---------- finale ---------- */
  .final-title{
    font-size:clamp(1.6rem, 8vw, 2.6rem);
    font-weight:800;
    text-align:center;
    letter-spacing:.3px;
    background:linear-gradient(135deg,#fff, var(--pink) 45%, var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:glowPulse 2.4s ease-in-out infinite, lineIn .8s cubic-bezier(.22,1,.36,1) forwards;
    filter:drop-shadow(0 0 18px rgba(255,110,199,.35));
  }
  @keyframes glowPulse{
    0%,100%{ filter:drop-shadow(0 0 14px rgba(255,110,199,.3)); }
    50%{ filter:drop-shadow(0 0 30px rgba(125,249,255,.5)); }
  }

  #hearts, #confetti{ position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .heart{
    position:absolute; bottom:-10%;
    font-size:1.2rem;
    animation:riseHeart linear forwards;
    opacity:.9;
  }
  @keyframes riseHeart{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translateY(-115dvh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
  }
  .confetti-piece{
    position:absolute; top:-5%;
    width:8px; height:14px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(115dvh) rotate(720deg); opacity:.9; }
  }

  .share-btn{
    margin-top:4px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:13px 26px;
    border-radius:18px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:transform .15s ease, background .25s ease;
  }
  .share-btn:active{ transform:scale(.96); }
  .share-btn:hover{ background:rgba(255,255,255,.18); }

  #toast{
    position:fixed; bottom:32px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(20,20,30,.85);
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    padding:11px 20px;
    border-radius:14px;
    font-size:.9rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:10;
    backdrop-filter:blur(10px);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  @media (max-width:360px){
    #card{ padding:28px 18px; }
  }
</style>
</head>
<body>

  <div id="sky"></div>
  <div id="particles"></div>

  <div id="stage">
    <div id="card">
      <div id="message-zone"></div>
      <div id="interact-zone"></div>
    </div>
  </div>

  <div id="hearts"></div>
  <div id="confetti"></div>
  <div id="toast"></div>

<script>
(function(){
  "use strict";

  const messageZone = document.getElementById('message-zone');
  const interactZone = document.getElementById('interact-zone');
  const sky = document.getElementById('sky');
  const particlesEl = document.getElementById('particles');
  const toastEl = document.getElementById('toast');

  const state = { name: '' };
  const MIN_LINE_HOLD = 4000;
  let lastLineShownAt = 0;

  /* ---------------- utils ---------------- */
  const wait = ms => new Promise(res => setTimeout(res, ms));

  async function clearMessages(){
    const lines = messageZone.querySelectorAll('.line');
    const indicators = messageZone.querySelectorAll('.typing-indicator');
    if(lines.length){
      const elapsed = Date.now() - lastLineShownAt;
      if(elapsed < MIN_LINE_HOLD) await wait(MIN_LINE_HOLD - elapsed);
    }
    if(!lines.length && !indicators.length){ messageZone.innerHTML=''; return; }
    messageZone.querySelectorAll('.line, .typing-indicator').forEach(l => l.classList.add('exit'));
    await wait(380);
    messageZone.innerHTML='';
  }

  async function typingBeat(ms=1100){
    const ind = document.createElement('div');
    ind.className = 'typing-indicator';
    ind.innerHTML = '<span></span><span></span><span></span>';
    messageZone.appendChild(ind);
    await wait(ms);
    ind.remove();
  }

  async function say(text, {dim=false, typing=true, holdBefore=650, holdAfter=0} = {}){
    await clearMessages();
    if(typing) await typingBeat(700 + Math.min(text.length*14, 900));
    const p = document.createElement('div');
    p.className = 'line' + (dim ? ' dim' : '');
    p.textContent = text;
    messageZone.appendChild(p);
    if(text) lastLineShownAt = Date.now();
    if(holdAfter) await wait(holdAfter);
  }

  function showInteract(node){
    interactZone.innerHTML = '';
    interactZone.appendChild(node);
    interactZone.classList.remove('hide');
    void interactZone.offsetWidth;
    interactZone.classList.add('show');
  }

  function hideInteract(){
    return new Promise(resolve=>{
      interactZone.classList.remove('show');
      interactZone.classList.add('hide');
      setTimeout(()=>{ interactZone.innerHTML=''; resolve(); }, 360);
    });
  }

  function ripple(e, btn){
    const r = document.createElement('span');
    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX ?? rect.left+rect.width/2) - rect.left - size/2 + 'px';
    r.style.top = (e.clientY ?? rect.top+rect.height/2) - rect.top - size/2 + 'px';
    btn.appendChild(r);
    setTimeout(()=>r.remove(), 650);
  }

  function askButtons(options, primaryIndex=-1){
    return new Promise(resolve=>{
      const row = document.createElement('div');
      row.className = 'btn-row';
      options.forEach((opt, i)=>{
        const b = document.createElement('button');
        b.className = 'choice' + (i===primaryIndex ? ' primary' : '');
        b.textContent = opt;
        b.addEventListener('click', async (e)=>{
          ripple(e, b);
          row.querySelectorAll('button').forEach(x=>x.disabled=true);
          await wait(180);
          await hideInteract();
          resolve(opt);
        });
        row.appendChild(b);
      });
      showInteract(row);
    });
  }

  function askName(){
    return new Promise(resolve=>{
      const wrap = document.createElement('div');
      wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.alignItems='center'; wrap.style.gap='14px';
      const input = document.createElement('input');
      input.type='text'; input.placeholder='Your name...'; input.maxLength=24; input.autocomplete='off';
      const btn = document.createElement('button');
      btn.className='choice primary'; btn.textContent='Continue';
      wrap.appendChild(input); wrap.appendChild(btn);

      const submit = async (e)=>{
        const val = input.value.trim();
        if(!val) { input.focus(); return; }
        if(e) ripple(e, btn);
        btn.disabled = true; input.disabled = true;
        await wait(150);
        await hideInteract();
        resolve(val);
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') submit(); });
      showInteract(wrap);
      setTimeout(()=>input.focus(), 300);
    });
  }

  function askSlider(){
    return new Promise(resolve=>{
      const wrap = document.createElement('div');
      wrap.className = 'slider-wrap';
      const val = document.createElement('div');
      val.className='slider-value'; val.textContent='5';
      const input = document.createElement('input');
      input.type='range'; input.min='0'; input.max='10'; input.value='5';
      input.style.setProperty('--fill','50%');
      const labels = document.createElement('div');
      labels.className='slider-labels';
      labels.innerHTML = '<span>0</span><span>10</span>';
      const btn = document.createElement('button');
      btn.className='choice primary'; btn.textContent='Lock it in';
      btn.style.marginTop='4px';

      input.addEventListener('input', ()=>{
        val.textContent = input.value;
        input.style.setProperty('--fill', (input.value*10)+'%');
      });

      btn.addEventListener('click', async (e)=>{
        ripple(e, btn);
        btn.disabled=true; input.disabled=true;
        await wait(150);
        await hideInteract();
        resolve(parseInt(input.value,10));
      });

      wrap.appendChild(val); wrap.appendChild(input); wrap.appendChild(labels); wrap.appendChild(btn);
      showInteract(wrap);
    });
  }

  /* ---------------- ambient particles ---------------- */
  function spawnParticles(n=26){
    for(let i=0;i<n;i++){
      const p = document.createElement('div');
      p.className='particle';
      const size = 2 + Math.random()*4;
      p.style.width = p.style.height = size+'px';
      p.style.left = Math.random()*100+'%';
      p.style.top = Math.random()*100+'%';
      p.style.animationDuration = (4+Math.random()*6)+'s';
      p.style.animationDelay = (Math.random()*4)+'s';
      particlesEl.appendChild(p);
    }
  }

  function turnParticlesGolden(){
    particlesEl.querySelectorAll('.particle').forEach(p=>{
      p.classList.add('gold');
    });
    sky.classList.add('finale');
  }

  function spawnHearts(){
    const container = document.getElementById('hearts');
    const glyphs = ['❤️','💛','💫','✨'];
    let count = 0;
    const interval = setInterval(()=>{
      const h = document.createElement('div');
      h.className='heart';
      h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      h.style.left = Math.random()*100+'%';
      h.style.setProperty('--drift', (Math.random()*80-40)+'px');
      h.style.animationDuration = (4+Math.random()*3)+'s';
      h.style.fontSize = (1+Math.random()*1.2)+'rem';
      container.appendChild(h);
      setTimeout(()=>h.remove(), 8000);
      count++;
      if(count>60) clearInterval(interval);
    }, 260);
  }

  function spawnConfetti(){
    const container = document.getElementById('confetti');
    const colors = ['#6C63FF','#FF6EC7','#7DF9FF','#FFD166','#FFFFFF'];
    for(let i=0;i<90;i++){
      const c = document.createElement('div');
      c.className='confetti-piece';
      c.style.left = Math.random()*100+'%';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2.6+Math.random()*2.2)+'s';
      c.style.animationDelay = (Math.random()*1.2)+'s';
      c.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
      container.appendChild(c);
      setTimeout(()=>c.remove(), 6000);
    }
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2400);
  }

  /* ---------------- conversation flow ---------------- */
  async function run(){
    spawnParticles();

    await say('', {typing:true, holdBefore:0});
    await wait(300);

    await say('Hey...');
    await wait(900);

    await say("I've been meaning to ask you something.", {dim:true});
    await wait(700);

    const wantsToTalk = await (async ()=>{
      await say('Can I ask you something?');
      return askButtons(['Yes','No'], 0);
    })();

    if(wantsToTalk === 'No'){
      await say('Too bad 😄');
      await wait(600);
      await say("I'm asking anyway.", {dim:true});
      await wait(500);
    }

    await say("Alright. First things first —");
    await wait(300);
    const name = await (async ()=>{
      await say('what should I call you?');
      return askName();
    })();
    state.name = name;

    await say(`Nice to meet you, ${state.name}.`);
    await wait(700);
    await say("You typed that quickly. I like that — no overthinking.", {dim:true});
    await wait(900);

    /* ---------- Q1 ---------- */
    await say(`Okay ${state.name}, here's the first one.`);
    await wait(600);
    const friendCount = await (async ()=>{
      await say('How many true friends do you think you have?');
      return askSlider();
    })();

    let q1resp;
    if(friendCount === 0) q1resp = "Zero. That's either very lonely, or very honest. Maybe both.";
    else if(friendCount <= 2) q1resp = `${friendCount === 1 ? 'One.' : 'Two.'} Small number. Big trust, probably.`;
    else if(friendCount <= 5) q1resp = "A handful. That's usually the ones who'd actually show up at 3 AM.";
    else if(friendCount <= 8) q1resp = "That's a lot of true friends. Or a generous definition of 'true.'";
    else q1resp = "Ten. Either you're extremely lucky, or extremely loved.";

    await say(q1resp);
    await wait(1100);
    await say("Funny thing — people almost never say a number without doubting it a second later.", {dim:true});
    await wait(1000);

    /* ---------- Q2 ---------- */
    await say("Let's go a little deeper.");
    await wait(600);
    const cried = await (async ()=>{
      await say('Have you ever cried in front of a friend?');
      return askButtons(['Yes','No','Only once']);
    })();

    let q2resp;
    if(cried === 'Yes') q2resp = "Good. That means someone earned the version of you without a filter.";
    else if(cried === 'No') q2resp = "Never. So somewhere, you're still holding the door shut. Understandable.";
    else q2resp = "Only once. That one time probably still lives rent-free in your memory.";

    await say(q2resp);
    await wait(1100);
    await say("Tears are just honesty with nowhere else to go.", {dim:true});
    await wait(1100);

    /* ---------- Q3 ---------- */
    await say("Different question now.");
    await wait(500);
    const priority = await (async ()=>{
      await say('What matters more?');
      return askButtons(['Love','Friendship','Family']);
    })();

    let q3resp;
    if(priority === 'Love') q3resp = "Love. Bold answer — the one that burns brightest and asks for the most.";
    else if(priority === 'Friendship') q3resp = "Friendship. The one you choose, again and again, for no obligation at all.";
    else q3resp = "Family. The one that was there before you had a say in it.";

    await say(q3resp);
    await wait(1000);
    await say("There's no wrong answer here. Just a window into what you protect first.", {dim:true});
    await wait(1100);

    /* ---------- Q4 ---------- */
    await say("One more scenario for you.");
    await wait(600);
    const call = await (async ()=>{
      await say('If your best friend called you at 2 AM...');
      return askButtons(["I'd answer immediately", "I'd call back later", "Depends"]);
    })();

    let q4resp;
    if(call === "I'd answer immediately") q4resp = "No hesitation. That's rare — most people let it ring twice, just to seem unbothered.";
    else if(call === "I'd call back later") q4resp = "Later, but you'd call back. Sleep matters, but so does showing up.";
    else q4resp = "Depends. Honest answer — not every 2 AM call is an emergency, and you know that.";

    await say(q4resp);
    await wait(1100);
    await say("The 2 AM ones tell you who actually made the list.", {dim:true});
    await wait(1100);

    /* ---------- Q5 ---------- */
    await say("Last one. And it's a harder one.");
    await wait(900);
    const believed = await (async ()=>{
      await say('Do you think someone considers YOU their best friend?');
      return askButtons(['Yes','No', "I'm not sure"]);
    })();

    await wait(400);
    await typingBeat(1900);

    let q5resp;
    if(believed === 'Yes') q5resp = "You should. Being someone's favorite person is quiet, but it's real.";
    else if(believed === 'No') q5resp = "Maybe not — but you'd be surprised who's quietly counting on you.";
    else q5resp = "You're not sure. Most people who matter most never get told directly.";

    await say(q5resp, {typing:false});
    await wait(1400);

    /* ---------- summary ---------- */
    await say(`So, ${state.name}...`);
    await wait(900);

    const beliefLine = friendCount <= 2
      ? "You trust people carefully."
      : friendCount >= 8
      ? "You let people in easily."
      : "You keep a small, honest circle.";

    const priorityLine = priority === 'Love' ? "You lead with feeling."
      : priority === 'Friendship' ? "You believe the ones you choose matter most."
      : "You never forget where you started.";

    const callLine = call === "I'd answer immediately" ? "You always answer the late-night calls."
      : call === "I'd call back later" ? "You show up, even if it's a little delayed."
      : "You read the room before you react.";

    const unsureLine = believed === "I'm not sure" ? "And you're still not sure whether someone sees you as their best friend."
      : believed === 'No' ? "And you don't think anyone counts you as their best friend."
      : "And somewhere, someone already does.";

    await say(beliefLine, {typing:true});
    await wait(1300);
    await say(priorityLine, {typing:true});
    await wait(1300);
    await say(callLine, {typing:true});
    await wait(1300);
    await say(unsureLine, {typing:true});
    await wait(1700);

    /* ---------- finale ---------- */
    await say('Maybe today...', {typing:true});
    await wait(1200);

    turnParticlesGolden();
    await wait(300);

    await say('...someone smiled because they have a friend like you.', {typing:true});
    await wait(1800);

    await clearMessages();
    await wait(200);

    const title = document.createElement('div');
    title.className = 'final-title';
    title.textContent = `Happy Friendship Day ${state.name} ❤️`;
    messageZone.appendChild(title);

    spawnHearts();
    spawnConfetti();
    await wait(1600);

    const shareBtn = document.createElement('button');
    shareBtn.className = 'share-btn';
    shareBtn.textContent = 'Share this experience';
    shareBtn.addEventListener('click', async (e)=>{
      ripple(e, shareBtn);
      const url = window.location.href;
      try{
        if(navigator.share){
          await navigator.share({ title:'Happy Friendship Day', text:'Someone wants to ask you something...', url });
        } else {
          await navigator.clipboard.writeText(url);
          showToast('Link copied!');
        }
      }catch(err){
        try{
          await navigator.clipboard.writeText(url);
          showToast('Link copied!');
        }catch(e2){ showToast('Copy the link from your address bar'); }
      }
    });

    const wrap = document.createElement('div');
    wrap.style.display='flex'; wrap.style.justifyContent='center'; wrap.style.width='100%';
    wrap.appendChild(shareBtn);
    showInteract(wrap);
  }

  window.addEventListener('DOMContentLoaded', ()=>{ run(); });
})();
</script>
</body>
</html>
